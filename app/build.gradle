plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.narutolauncher.lite'
    compileSdk 34

    defaultConfig {
        applicationId "com.narutolauncher.lite"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0-Lite"
    }

    buildTypes {
        release {
            minifyEnabled true  // Kompres APK sekecil mungkin
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'  // Untuk download file
}
